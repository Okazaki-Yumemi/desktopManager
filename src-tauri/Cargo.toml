[package]
name = "desktop-manager"
version = "0.1.0"
description = "Lightweight personal desktop workspace manager"
authors = ["Okazaki-Yumemi"]
edition = "2021"
rust-version = "1.82"

# Keep the main crate independent from sibling probe crates on disk.
[workspace]

[lib]
name = "desktop_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
notify = "8"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
] }

[profile.release]
# Favor a smaller binary: DesktopManager is a resident background tool.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
