# Application-defined permission: grants the MAIN window access to every
# application command.
#
# IMPORTANT: since an app permission file exists the app has an ACL manifest,
# so every #[tauri::command] MUST be listed here — a missing entry makes the
# frontend call fail with "not allowed by ACL" even from the main window.
[[permission]]
identifier = "allow-app-commands"
description = "Allow the main window to call all application commands"
commands.allow = [
  "app_info",
  "settings_get",
  "settings_set",
  "shortcuts_get",
  "desktop_list",
  "desktop_search",
  "desktop_rescan",
  "desktop_open",
  "desktop_icon",
  "collections_list",
  "collection_create",
  "collection_rename",
  "collection_delete",
  "collection_assign",
  "collection_unassign",
  "collection_items",
  "collection_assign_external",
  "collection_open",
  "browse_children",
  "background_set",
  "background_clear",
  "appdata_purge",
  "layout_capture",
  "layout_list",
  "layout_apply",
  "layout_delete",
  "scenes_list",
  "scene_create",
  "scene_rename",
  "scene_delete",
  "scene_set_visibility",
  "scene_visibility",
  "focus_start",
  "focus_running",
  "focus_finish",
  "focus_interrupt",
  "focus_note",
  "focus_sessions",
  "focus_summary",
  "task_list",
  "task_create",
  "task_update",
  "task_set_status",
  "task_delete",
  "event_list_range",
  "event_create",
  "event_update",
  "event_reschedule",
  "event_delete",
  "event_export_ics",
  "sjtu_list",
  "sjtu_clear",
  "sjtu_open_sync",
]
